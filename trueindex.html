<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAR Slideshow</title>
<style>
  :root { --bg:#0e0f11; --panel:#17191c; --line:#2a2d32; --text:#e6e7e9; --dim:#8a8f98; --accent:#7aa2f7; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  button, select, input { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }

  /* Drop screen */
  #drop { height:100%; display:grid; place-items:center; padding:24px; }
  #zone { width:min(560px,100%); padding:64px 24px; border:2px dashed var(--line); border-radius:14px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  #zone.over { border-color:var(--accent); background:#14171d; }
  #zone h1 { font-size:20px; font-weight:600; margin-bottom:8px; }
  #zone p { color:var(--dim); }
  #status { margin-top:18px; min-height:1.4em; color:var(--dim); }
  #status.err { color:#f7768e; }

  /* Player */
  #player { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; }
  #stage { flex:1; min-height:0; display:grid; place-items:center; overflow:hidden; container-type:size; }
  #frame { position:relative; width:100cqw; height:100cqh; overflow:hidden; }
  #img { width:100%; height:100%; object-fit:contain; display:block; }
  #img.rot, #img.rotl { position:absolute; left:50%; top:50%; width:100cqh; height:100cqw; }
  #img.rot { transform:translate(-50%,-50%) rotate(90deg); }
  #img.rotl { transform:translate(-50%,-50%) rotate(-90deg); }
  #player.fs #bar { position:absolute; left:0; right:0; bottom:0; transition:opacity .25s; }
  #player.fs.idle #bar { opacity:0; pointer-events:none; }
  #player.fs.idle { cursor:none; }
  #frame.h #img, #frame.v #img { object-fit:cover; }

  #bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:10px 14px; background:var(--panel); border-top:1px solid var(--line); min-height:64px; }
  #bar button { background:#22252a; border:1px solid var(--line); border-radius:8px; padding:7px 14px; cursor:pointer; }
  #bar button:hover { border-color:var(--accent); }
  #bar label { display:flex; align-items:center; gap:8px; color:var(--dim); }
  #bar select, #bar input[type=number] { background:#22252a; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  #bar input[type=number] { width:64px; }
  #bar input[type=range] { width:110px; accent-color:var(--accent); }
  #count { color:var(--dim); font-variant-numeric:tabular-nums; min-width:72px; text-align:center; }
  #name { color:var(--dim); flex:1; min-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #close { margin-left:auto; }
</style>
</head>
<body>

<section id="drop">
  <div>
    <div id="zone" tabindex="0" role="button" aria-label="Drop a RAR file or click to choose one">
      <h1>Drop a .rar file here</h1>
      <p>or click to choose one. Images are read into memory only. Nothing is saved.</p>
    </div>
    <p id="status" role="status"></p>
    <input id="picker" type="file" accept=".rar,application/vnd.rar,application/x-rar-compressed" hidden>
  </div>
</section>

<section id="player" hidden>
  <div id="stage"><div id="frame"><img id="img" alt=""></div></div>
  <div id="bar">
    <button id="prev" aria-label="Previous image">Prev</button>
    <button id="play" aria-label="Play or pause">Pause</button>
    <button id="next" aria-label="Next image">Next</button>
    <span id="count"></span>
    <label><span id="intLbl">Interval</span>
      <input id="secs" type="range" min="1" max="30" step="1" value="4">
      <input id="secsNum" type="number" min="1" max="60" step="1" value="4" aria-label="Seconds between slides"> s
    </label>
    <label hidden id="minWrap">Min <input id="minSecs" type="number" min="1" max="60" step="1" value="2" aria-label="Minimum seconds"> s</label>
    <label><input type="checkbox" id="rndTime"> Random interval</label>
    <label><input type="checkbox" id="rndImg"> Random order</label>
    <label>Orientation
      <select id="orient">
        <option value="none">None</option>
        <option value="h-cw">Force Horizontal (turn right)</option>
        <option value="h-ccw">Force Horizontal (turn left)</option>
        <option value="v-cw">Force Vertical (turn right)</option>
        <option value="v-ccw">Force Vertical (turn left)</option>
      </select>
    </label>
    <span id="name"></span>
    <button id="fs" aria-label="Toggle fullscreen">Fullscreen</button>
    <button id="close">Close archive</button>
  </div>
</section>

<script type="module">
import { createExtractorFromData } from "https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/+esm";

const WASM_URL = "https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/js/unrar.wasm";
const MIME = { jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", gif:"image/gif", webp:"image/webp", bmp:"image/bmp", avif:"image/avif", svg:"image/svg+xml" };
const $ = id => document.getElementById(id);

// All state lives in RAM only: Blobs held in this array, one live object URL at a time.
let slides = [];      // [{ name, blob }]
let index = 0;
let currentUrl = null;
let playing = true;
let timer = null;
let wasmBinary = null;
let order = [];       // play order: positions -> slide indexes
let shuffle = false;

function buildOrder(cur) {
  order = slides.map((_, i) => i);
  if (!shuffle) { index = cur; return; }
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.splice(order.indexOf(cur), 1); order.unshift(cur);   // keep the current image first
  index = 0;
}

function sniff(b) {
  const s = (i, str) => [...str].every((c, k) => b[i + k] === c.charCodeAt(0));
  if (b[0] === 0xFF && b[1] === 0xD8) return "image/jpeg";
  if (b[0] === 0x89 && s(1, "PNG")) return "image/png";
  if (s(0, "GIF8")) return "image/gif";
  if (s(0, "RIFF") && s(8, "WEBP")) return "image/webp";
  if (s(0, "BM")) return "image/bmp";
  if (s(4, "ftypavif")) return "image/avif";
  return null;
}
$("img").addEventListener("error", async () => {
  if (!slides.length) return;
  const sl = slides[order[index]];
  let extra = "";
  try {
    const head = new DataView(await sl.blob.slice(0, 32).arrayBuffer());
    const tail = new Uint8Array(await sl.blob.slice(-12).arrayBuffer());
    if (sl.blob.type === "image/png") {
      const iend = [0x49,0x45,0x4E,0x44,0xAE,0x42,0x60,0x82].every((v, i) => tail[4 + i] === v);
      extra = `, ${head.getUint32(16)}x${head.getUint32(20)} px, complete PNG ending: ${iend ? "yes" : "NO (truncated/corrupt)"}`;
    }
  } catch {}
  $("name").textContent = `Cannot display ${sl.name} (${sl.blob.type || "unknown type"}, ${sl.blob.size} bytes${extra})`;
});

/* ---------- Loading ---------- */
function setStatus(msg, err = false) { const s = $("status"); s.textContent = msg; s.classList.toggle("err", err); }

async function loadArchive(file) {
  if (!file || !/\.rar$/i.test(file.name)) { setStatus("That is not a .rar file.", true); return; }
  setStatus("Reading archive into memory…");
  try {
    wasmBinary ??= await (await fetch(WASM_URL)).arrayBuffer();
    let data = new Uint8Array(await file.arrayBuffer());
    const extractor = await createExtractorFromData({ data, wasmBinary });
    const names = [...extractor.getFileList().fileHeaders]
      .filter(h => !h.flags.directory && MIME[h.name.split(".").pop().toLowerCase()])
      .map(h => h.name)
      .sort((a, b) => a.localeCompare(b, undefined, { numeric:true, sensitivity:"base" }));
    if (!names.length) { setStatus("No images found in this archive.", true); data = null; return; }

    const out = [];
    const { files } = extractor.extract({ files: names });
    for (const f of files) {
      if (!f.extraction) continue;
      const ext = f.fileHeader.name.split(".").pop().toLowerCase();
      const raw = f.extraction.data ?? f.extraction;   // library versions differ in shape
      if (!raw || typeof raw.byteLength !== "number") continue;
      const bytes = new Uint8Array(raw);               // copy out of WASM memory
      if (!bytes.length) continue;
      out.push({ name: f.fileHeader.name, blob: new Blob([bytes], { type: sniff(bytes) || MIME[ext] }) });
    }
    data = null; // release the archive bytes
    out.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:"base" }));
    if (!out.length) { setStatus("Could not extract any images. The archive may be encrypted or damaged.", true); return; }

    slides = out; index = 0; order = []; buildOrder(0); playing = true;
    $("drop").hidden = true; $("player").hidden = false;
    setStatus("");
    show(0); schedule(); updatePlayLabel();
  } catch (e) {
    console.error(e);
    setStatus("Could not read this archive. It may be encrypted, damaged, or an unsupported RAR version.", true);
  }
}

/* ---------- Display ---------- */
function show(i) {
  if (!slides.length) return;
  if (shuffle && i >= slides.length && slides.length > 1) { buildOrder(order[slides.length - 1]); i = 1; }
  index = (i + slides.length) % slides.length;
  const img = $("img");
  const old = currentUrl;
  currentUrl = URL.createObjectURL(slides[order[index]].blob);
  img.src = currentUrl;
  if (old) URL.revokeObjectURL(old);   // revoke the previous image immediately
  $("count").textContent = `${index + 1} / ${slides.length}`;
  $("name").textContent = slides[order[index]].name;
}

function schedule() {
  clearTimeout(timer);
  if (!playing || slides.length < 2) return;
  timer = setTimeout(() => { show(index + 1); schedule(); }, nextDelay());
}
function nextDelay() {
  const max = secs();
  if (!$("rndTime").checked) return max * 1000;
  const min = Math.min(Math.max(1, Number($("minSecs").value) || 1), max);
  return (min + Math.random() * (max - min)) * 1000;
}
const secs = () => Math.max(1, Number($("secsNum").value) || 4);
function updatePlayLabel() { $("play").textContent = playing ? "Pause" : "Play"; }
function go(d) { show(index + d); schedule(); }

function closeArchive() {
  clearTimeout(timer);
  if (document.fullscreenElement) document.exitFullscreen();
  $("img").removeAttribute("src");
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = null;
  slides = []; index = 0;               // drop all Blob references so they can be garbage collected
  $("player").hidden = true; $("drop").hidden = false;
  $("picker").value = "";
  setStatus("");
}

/* ---------- Events ---------- */
const zone = $("zone");
zone.addEventListener("click", () => $("picker").click());
zone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("picker").click(); } });
$("picker").addEventListener("change", e => loadArchive(e.target.files[0]));
["dragenter", "dragover"].forEach(t => window.addEventListener(t, e => { e.preventDefault(); if (!$("drop").hidden) zone.classList.add("over"); }));
["dragleave", "drop"].forEach(t => window.addEventListener(t, e => { e.preventDefault(); zone.classList.remove("over"); }));
window.addEventListener("drop", e => { if (!$("drop").hidden) loadArchive(e.dataTransfer.files[0]); });

$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("play").onclick = () => { playing = !playing; updatePlayLabel(); schedule(); };
$("close").onclick = closeArchive;

function setSecs(v) {
  v = Math.min(60, Math.max(1, Math.round(Number(v)) || 4));
  $("secsNum").value = v; $("secs").value = Math.min(30, v);
  schedule();
}
$("secs").oninput = e => setSecs(e.target.value);
$("secsNum").onchange = e => setSecs(e.target.value);

// Orientation lock: rotate (display only) so the image matches the chosen orientation.
function applyOrient() {
  const img = $("img"), [mode, dir] = $("orient").value.split("-");
  const w = img.naturalWidth, h = img.naturalHeight;
  const rot = (mode === "h" && h > w) || (mode === "v" && w > h);
  img.classList.toggle("rot", rot && dir === "cw");
  img.classList.toggle("rotl", rot && dir === "ccw");
}

$("rndImg").onchange = e => { shuffle = e.target.checked; buildOrder(order[index]); show(index); schedule(); };
$("rndTime").onchange = e => {
  $("minWrap").hidden = !e.target.checked;
  $("intLbl").textContent = e.target.checked ? "Max interval" : "Interval";
  schedule();
};
$("minSecs").onchange = schedule;
$("orient").onchange = applyOrient;
$("img").addEventListener("load", applyOrient);

// Fullscreen with auto-hiding controls
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else $("player").requestFullscreen?.({ navigationUI: "hide" });
}
$("fs").onclick = toggleFs;
let idleT;
function wake() {
  const p = $("player");
  p.classList.remove("idle");
  clearTimeout(idleT);
  if (!document.fullscreenElement) return;
  idleT = setTimeout(() => { $("bar").matches(":hover") ? wake() : p.classList.add("idle"); }, 2500);
}
["mousemove", "pointerdown", "touchstart", "keydown"].forEach(t => window.addEventListener(t, wake, { passive:true }));
document.addEventListener("fullscreenchange", () => {
  $("player").classList.toggle("fs", !!document.fullscreenElement);
  wake();
});

window.addEventListener("keydown", e => {
  if ($("player").hidden || e.target.matches("input, select")) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " ") { e.preventDefault(); $("play").click(); }
  else if (e.key.toLowerCase() === "f") toggleFs();
  else if (e.key === "Escape" && !document.fullscreenElement) closeArchive();
});
window.addEventListener("pagehide", () => { if (currentUrl) URL.revokeObjectURL(currentUrl); });
</script>
</body>
</html>
